[package]
name = "labkit"
version = "0.4.0"
edition = "2021"
rust-version = "1.99"
build = "build.rs"
license = "MIT"
repository = "https://github.com/Funvvell/labkit"
description = "科研工具箱 LabKit — Tauri + Rust 科研工作台（病理切片裁剪 / qPCR / 科研管理）"

[lib]
name = "labkit"
path = "src/lib.rs"

[[bin]]
name = "labkit"
path = "src/main.rs"

[dependencies]
# --- Tauri shell (replaces egui/eframe UI) ---
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# P1 多窗口：逐窗口记忆尺寸/位置（官方插件，MIT/Apache-2.0）
tauri-plugin-window-state = "2"
# P3 Zotero / P4 插件市场：Rust 侧 HTTP 单一信任边界（Zotero 丢弃浏览器形态请求）。
# reqwest MIT/Apache-2.0；rustls 避免 Windows 上的 OpenSSL 依赖。
# system-proxy：Windows 系统代理（Clash / Steam++ 等）默认生效；native-roots：
# 信任 Windows 证书库，兼容 Steam++ 等本地加速器的 TLS 中间人证书。
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls-native-roots", "system-proxy"] }
url = "2"

# --- Reused core: SDPC decode + export + qPCR (unchanged) ---
libloading = "0.8"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff"] }
tiff = "0.9"
# WSI 读取：纯 Rust（MIT/Apache-2.0），覆盖 SVS/NDPI/MRXS/SCN/BIF/VMS/VSI/CZI/DICOM/OME-TIFF；
# 官方说明 Sakura 无公开样本、暂不支持。要求 Rust 1.99+。
wsi-rs = { version = "0.9.2", default-features = false }
# PNG pHYs（DPI 标签）与导出格式控制。png 已是 image 的传递依赖，直接固定同一版本。
png = "0.18"
# SDPC 自动下载：wheel 是 zip 容器；zip 已是 calamine 的传递依赖，固定同一版本。
zip = { version = "9", default-features = false, features = ["deflate"] }
rayon = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Markdown Vault 的 YAML frontmatter 解析。serde_yaml 上游已归档，serde_yaml_ng /
# serde_norway 停更于 2024 年，serde_yml 因 unsoundness 废弃；yaml-rust2 是唯一
# 活跃维护的 YAML 1.2 实现（MIT/Apache-2.0），且自带 YamlEmitter 可做对拍。
yaml-rust2 = "0.13"
thiserror = "2"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

crossbeam-channel = "0.5"
lru = "0.19"
getrandom = "0.2"
chrono = { version = "0.4", features = ["clock"] }
dirs = "5"
sha2 = "0.10"
base64 = "0.22"
openreadout-qpcr = "=0.4.0"
calamine = "0.38"
csv = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# 安全补丁：openreadout-qpcr 0.4.0（crates.io 最新）硬锁 calamine 0.36 → zip 8.6.0
# （5 个安全公告，含 1 critical）。vendor 副本仅把 calamine 升到 0.38（zip 9.8.1），
# API 兼容已由编译与测试验证。上游发布新版后删除 vendor 并回到 crates.io。
[patch.crates-io]
openreadout-qpcr = { path = "vendor/openreadout-qpcr" }
