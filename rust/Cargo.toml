[package]
name = "labkit"
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
build = "build.rs"
description = "科研工具箱 LabKit — Tauri + Rust 科研工作台（病理切片裁剪 / qPCR / 科研管理）"

[lib]
name = "labkit"
path = "src/lib.rs"

[[bin]]
name = "labkit"
path = "src/main.rs"

[dependencies]
# --- Tauri shell (replaces egui/eframe UI) ---
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

# --- Reused core: SDPC decode + export + qPCR (unchanged) ---
libloading = "0.8"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
tiff = "0.9"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

crossbeam-channel = "0.5"
lru = "0.12"
getrandom = "0.2"
chrono = { version = "0.4", features = ["clock"] }
dirs = "5"
sha2 = "0.10"
base64 = "0.22"
openreadout-qpcr = "=0.4.0"
calamine = "0.36"
csv = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
