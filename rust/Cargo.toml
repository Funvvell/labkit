[package]
name = "pathology-crop-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
build = "build.rs"
description = "SDPC whole-slide viewer and ROI crop tool (Rust/egui rewrite)"

[lib]
name = "pathology_crop_rs"
path = "src/lib.rs"

[[bin]]
name = "pathology-crop-rs"
path = "src/main.rs"

[dependencies]
libloading = "0.8"
encoding_rs = "0.8"

eframe = { version = "0.31", features = ["persistence"] }
egui = "0.31"
rfd = "0.15"

image = { version = "0.25", default-features = false, features = ["png"] }
tiff = "0.9"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

crossbeam-channel = "0.5"
lru = "0.12"
getrandom = "0.2"
chrono = { version = "0.4", features = ["clock"] }
dirs = "5"
sha2 = "0.10"
openreadout-qpcr = "=0.4.0"
calamine = "0.36"
csv = "1"
egui-phosphor = "=0.9.0"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
