name: Release LabKit Plugin

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest
        run: |
          node -e "const m=require('./manifest.json'); if(!m.id||!m.name||!m.main) process.exit(1); console.log('manifest ok: '+m.id+' '+m.version)"
      - name: Create release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manifest.json
            main.js
            styles.css
          generate_release_notes: true
