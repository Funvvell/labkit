name: Release LabKit

# tag 推送（v*）触发：tauri-action 出 Windows NSIS 安装包，另附 portable zip。
# 前端零构建（classic script），无需 Node 步骤。
# 注意：安装包不含闭源 SDPC 解码 DLL（许可未覆盖再分发），
# 用户 pip install sdpc-for-python 后应用自动探测；其余工具不受影响。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  release-windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Read version from tauri.conf.json
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content rust/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build & publish NSIS installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: rust
          tagName: v__VERSION__
          releaseName: "LabKit v__VERSION__"
          releaseBody: "更新内容见 CHANGELOG.md。安装包不含闭源 SDPC 解码组件：安装后执行 pip install sdpc-for-python，应用会自动探测解码目录；其余 19 个工具与台账功能不受影响。"
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      # 应用内更新依赖三项资产：portable zip、裸 exe（直接替换用）、latest.json（版本 + sha256）。
      - name: Pack portable zip + update assets
        shell: pwsh
        run: |
          $exe = "rust/target/release/labkit.exe"
          if (-not (Test-Path $exe)) { throw "labkit.exe not found after tauri build" }
          Compress-Archive -Path $exe -DestinationPath "LabKit-portable-win-x64.zip"
          $ver = "${{ steps.ver.outputs.version }}"
          $sha = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $exe).Length
          Copy-Item $exe "LabKit-win-x64.exe"
          $manifest = [ordered]@{
            version = $ver
            notes = "更新内容见 CHANGELOG.md 与 GitHub Release 页面。安装包不含闭源 SDPC 解码组件：执行 pip install sdpc-for-python 后应用会自动探测解码目录。"
            pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd'T'HH:mm:ss'Z'")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$ver/LabKit-win-x64.exe"
                sha256 = $sha
                size = $size
              }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText((Join-Path (Get-Location) "latest.json"), $json, (New-Object Text.UTF8Encoding($false)))

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: |
            LabKit-portable-win-x64.zip
            LabKit-win-x64.exe
            latest.json