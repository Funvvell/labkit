name: 功能建议 · Feature request
description: 建议一个新工具或交互改进 / Suggest a tool or interaction improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does it solve
      description: 科研场景描述优先于实现方案 / Describe the research scenario first
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed solution
      description: 新工具请给出公式/算法来源与许可（需兼容 MIT）/ For new tools cite formula sources and licenses (MIT-compatible)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives considered
    validations:
      required: false